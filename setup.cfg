[flake8]
max-line-length = 88
extend-ignore = E203,W503
exclude =
    .git,
    venv,
    node_modules,
    .pytest_cache,
    __pycache__,
    docs,
    build,
    dist

[mypy]

[mypy-flask_restx]
ignore_missing_imports = True

[mypy-flask_restx.*]
ignore_missing_imports = True

[mypy-flask_cors]
ignore_missing_imports = True

[mypy-flask_cors.*]
ignore_missing_imports = True
